services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: acots
      POSTGRES_USER: acots
      POSTGRES_PASSWORD: acots
    ports:
      # Host port 5432 is commonly occupied by a system PostgreSQL service.
      # Keep the project database isolated and use the matching .env URL.
      - "5433:5432"
    volumes:
      - acots-postgres-data:/var/lib/postgresql/data

volumes:
  acots-postgres-data:
